version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: desi2door-mongo
    restart: always
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: desi2door
    ports:
      - "27017:27017"

  backend:
    build: ./backend
    container_name: desi2door-backend
    restart: always
    depends_on:
      - mongodb
    env_file: ./backend/.env
    environment:
      MONGO_URI: mongodb://mongodb:27017/desi2door
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: desi2door-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
